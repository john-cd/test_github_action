# Workflow contract documentation (maintained with the implementation).
# Workflow contract: test_github_action / Rust GitHub Action test workflow.
# Purpose: Validate the maintained source with the tools and commands listed in this job.
# Execution: push, workflow_dispatch. Trigger branches/paths below are the authoritative input
# boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

name: Rust GitHub Action test workflow

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Serialize side effects; superseded validation may stop before spending more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job test_job: Validate the maintained source with the tools and commands listed in this job.
  # Keep compatible checks in the same job to reuse installed dependencies and build outputs;
  # distinct OS/feature entries retain their behavior coverage.
  test_job:
    name: Build, load, and run the action image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the test application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the application image archive
        id: build_image
        uses: john-cd/rust_github_action@90676192279197c6d8d5802d2531af644e117a25
        with:
          app-name: test_app
          output-file-name: test-app

      - name: Validate and run the exported image
        env:
          ACTION_OUTPUT_FILE_PATH: ${{ steps.build_image.outputs.output_file_path }}
        shell: bash
        run: |
          set -euo pipefail

          archive_path="${ACTION_OUTPUT_FILE_PATH:?The action did not set output_file_path}"
          if [[ ! -f "$archive_path" ]]; then
            printf 'Action output is not a file: %s\n' "$archive_path" >&2
            exit 1
          fi

          unzip -t "$archive_path"
          image_tar="$RUNNER_TEMP/test-app.tar"
          unzip -p "$archive_path" > "$image_tar"
          test -s "$image_tar"
          if ! tar -tf "$image_tar" | grep -Fx 'manifest.json' >/dev/null; then
            echo 'The exported archive does not contain a Docker image manifest.' >&2
            exit 1
          fi

          docker load --input "$image_tar"
          docker image inspect final-app:latest >/dev/null
          output="$(docker run --rm final-app:latest)"
          if [[ "$output" != 'Hello, world!' ]]; then
            printf 'Unexpected container output: <%s>\n' "$output" >&2
            exit 1
          fi
