name: Rust GitHub Action test workflow

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_job:
    name: Build, load, and run the action image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the test application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the application image archive
        id: build_image
        uses: john-cd/rust_github_action@90676192279197c6d8d5802d2531af644e117a25
        with:
          app-name: test_app
          output-file-name: test-app

      - name: Validate and run the exported image
        env:
          ACTION_OUTPUT_FILE_PATH: ${{ steps.build_image.outputs.output_file_path }}
        shell: bash
        run: |
          set -euo pipefail

          archive_path="${ACTION_OUTPUT_FILE_PATH:?The action did not set output_file_path}"
          if [[ ! -f "$archive_path" ]]; then
            printf 'Action output is not a file: %s\n' "$archive_path" >&2
            exit 1
          fi

          unzip -t "$archive_path"
          image_tar="$RUNNER_TEMP/test-app.tar"
          unzip -p "$archive_path" > "$image_tar"
          test -s "$image_tar"
          if ! tar -tf "$image_tar" | grep -Fx 'manifest.json' >/dev/null; then
            echo 'The exported archive does not contain a Docker image manifest.' >&2
            exit 1
          fi

          docker load --input "$image_tar"
          docker image inspect final-app:latest >/dev/null
          output="$(docker run --rm final-app:latest)"
          if [[ "$output" != 'Hello, world!' ]]; then
            printf 'Unexpected container output: <%s>\n' "$output" >&2
            exit 1
          fi
