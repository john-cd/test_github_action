# Workflow contract documentation (maintained with the implementation).
# Workflow contract: test_github_action / Rust minimum version.
# Purpose: Check the declared minimum Rust compiler, independently of the current development
# compiler.
# Execution: pull_request, push, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

name: Rust minimum version

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize side effects; superseded validation may stop before spending more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job msrv: Check the declared minimum Rust compiler, independently of the current development
  # compiler.
  # A passing current-toolchain build does not prove the advertised minimum version still compiles.
  msrv:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Check .
        working-directory: .
        run: cargo +1.98.1 check --locked --workspace --all-targets
